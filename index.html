<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f14">
<title>KOBI 75</title>
<style>
  :root{
    --bg:#0b0f14;
    --card:#151b23;
    --card-2:#1c2530;
    --border:#26313d;
    --text:#e9eef3;
    --text-dim:#8a97a5;
    --accent:#2dd4a7;
    --accent-dim:#1d5c4d;
    --red:#ef4444;
    --orange:#f59e0b;
    --blue:#38bdf8;
    --green:#22c55e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:76px;
  }
  #app{max-width:520px;margin:0 auto;padding:14px 14px 8px;}
  .quote{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    margin:0 0 12px;
  }
  header.day-header{margin-bottom:10px;}
  .day-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .day-nav button{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    font-size:22px;
    width:44px;height:44px;
    border-radius:12px;
  }
  .day-nav button:disabled{opacity:.3;}
  .day-title{text-align:center;flex:1;}
  .day-title .big{font-size:19px;font-weight:700;}
  .day-title .sub{font-size:13px;color:var(--text-dim);margin-top:2px;}
  .progress-bar{
    height:6px;border-radius:4px;background:var(--card-2);
    margin-top:10px;overflow:hidden;
  }
  .progress-bar > div{height:100%;background:var(--accent);}
  .banner{
    padding:10px 14px;border-radius:12px;font-size:14px;margin-bottom:10px;
    font-weight:600;
  }
  .banner.danger{background:#3a1414;color:#ff9b9b;border:1px solid #5c2020;}
  .banner.info{background:#16232f;color:#9fd3f5;border:1px solid #234156;}
  .score-block{
    text-align:center;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
  }
  .score-num{font-size:52px;font-weight:800;line-height:1;}
  .score-label{font-size:15px;font-weight:700;margin-top:4px;}
  .score-out{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .checklist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .row{
    display:flex;align-items:center;gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    min-height:56px;
    padding:10px 14px;
  }
  .row.checked{background:var(--accent-dim);border-color:var(--accent);}
  .row.dim{opacity:.55;}
  .row.highlight{outline:2px solid var(--orange);}
  .row.disabled{pointer-events:none;}
  .box{
    width:28px;height:28px;flex:0 0 28px;
    border-radius:8px;border:2px solid var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:900;
  }
  .row.checked .box{background:var(--accent);border-color:var(--accent);color:#04231b;}
  .row-text{flex:1;}
  .row-text .label{font-size:15px;font-weight:600;}
  .row-text .hint{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .row-points{font-size:13px;color:var(--text-dim);}
  .row.checked .row-points{color:#bff4e4;}
  .weekend-time{
    display:flex;align-items:center;gap:8px;margin-top:8px;
  }
  .weekend-time input[type=time]{
    background:var(--card-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:6px 8px;font-size:14px;
  }
  textarea, input[type=text], input[type=number]{
    width:100%;background:var(--card);border:1px solid var(--border);
    color:var(--text);border-radius:12px;padding:12px;font-size:15px;
    font-family:inherit;
  }
  textarea{min-height:70px;resize:vertical;}
  .field-label{font-size:14px;color:var(--text-dim);margin:0 0 6px;font-weight:600;}
  .field-block{margin-bottom:16px;}
  .small-btn{
    background:var(--card);border:1px solid var(--border);color:var(--text-dim);
    border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;
  }
  .min-note{
    background:var(--card-2);border:1px solid var(--border);border-radius:12px;
    padding:12px;font-size:13px;color:var(--text-dim);margin-bottom:12px;line-height:1.6;
  }
  .miss-twice{font-size:13px;color:var(--orange);margin-bottom:10px;font-weight:600;}
  nav#bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);border-top:1px solid var(--border);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav#bottom-nav button{
    flex:1;background:transparent;border:0;color:var(--text-dim);
    padding:12px 4px;font-size:12px;font-weight:600;
  }
  nav#bottom-nav button.active{color:var(--accent);}
  .screen{display:none;}
  .screen.active{display:block;}
  .week-days{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .week-day-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 14px;min-height:48px;
  }
  .week-day-row .info{font-size:14px;}
  .week-day-row .score{font-size:14px;font-weight:700;color:var(--text-dim);}
  .week-day-row.chosen{border-color:var(--accent);}
  .week-day-row.chosen .info{color:var(--accent);}
  table.week-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px;}
  table.week-table th, table.week-table td{
    padding:8px 6px;text-align:center;border-bottom:1px solid var(--border);
  }
  table.week-table th{color:var(--text-dim);font-weight:600;}
  select.tefillin-select{
    width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:12px;font-size:15px;
  }
  h2.screen-title{font-size:20px;margin:4px 0 14px;}
  .export-btn{
    width:100%;background:var(--accent);color:#04231b;border:0;border-radius:14px;
    padding:16px;font-size:16px;font-weight:800;margin-bottom:10px;
  }
  .placeholder-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:16px;color:var(--text-dim);font-size:14px;line-height:1.7;
  }
  #toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--card-2);border:1px solid var(--accent);color:var(--text);
    padding:10px 16px;border-radius:12px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
  }
  #toast.show{opacity:1;}
  .summary-screen{
    text-align:center;padding:40px 10px;color:var(--text-dim);
  }
  .summary-screen .big{font-size:22px;color:var(--text);font-weight:700;margin-bottom:10px;}
  .overlay{
    position:fixed;inset:0;background:var(--bg);z-index:60;
    overflow-y:auto;
  }
  .overlay.hidden{display:none;}
  .overlay-inner{max-width:520px;margin:0 auto;padding:14px 14px 40px;}
  .chart-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:14px;margin-bottom:16px;
  }
  .chart-card .field-label{margin-bottom:10px;}
  .chart-card svg{width:100%;height:auto;display:block;}
  .weekly-avg-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .weekly-avg-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:8px 12px;font-size:13px;
  }
  table.endurance-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;}
  table.endurance-table th, table.endurance-table td{
    padding:6px 4px;text-align:center;border-bottom:1px solid var(--border);
  }
  table.endurance-table th{color:var(--text-dim);font-weight:600;}
  table.endurance-table input{
    width:100%;background:var(--card-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:6px;font-size:12px;text-align:center;
  }
  .danger-btn{
    width:100%;background:transparent;color:var(--red);border:1px solid var(--red);
    border-radius:14px;padding:14px;font-size:15px;font-weight:700;margin-top:16px;
  }
  .banner.warn{background:#3a2a10;color:#ffcf8a;border:1px solid #5c4620;cursor:pointer;}
  .import-row{display:flex;gap:8px;margin-top:8px;}
  .import-row button{
    background:var(--accent);color:#04231b;border:0;border-radius:10px;
    padding:10px 16px;font-size:14px;font-weight:700;flex:0 0 auto;
  }
</style>
</head>
<body>
<div id="app">
  <p class="quote">עקביות לפני שלמות. פספוס של פעולה אינו מאפס את האתגר.</p>

  <main id="screen-today" class="screen"></main>
  <main id="screen-week" class="screen"></main>
  <main id="screen-trend" class="screen"></main>
  <main id="screen-settings" class="screen"></main>
</div>

<div id="bad-day-overlay" class="overlay hidden">
  <div class="overlay-inner" id="bad-day-content"></div>
</div>

<div id="toast"></div>

<nav id="bottom-nav">
  <button data-tab="today">היום</button>
  <button data-tab="week">השבוע</button>
  <button data-tab="trend">מגמה</button>
  <button data-tab="settings">הגדרות</button>
</nav>

<script>
(function(){
  "use strict";

  /* ===================== קבועים ===================== */
  var CHALLENGE_START = "2026-08-30";
  var TOTAL_DAYS = 75;
  var WEEKEND_SLEEP_CEILING = "01:00";
  var STORAGE_KEY = "kobi75";

  var STAGES = [
    {from:1,  to:7,  name:"התנעה"},
    {from:8,  to:14, name:"ייצוב"},
    {from:15, to:21, name:"עליית רמה"},
    {from:22, to:50, name:"שגרה"},
    {from:51, to:75, name:"קיבוע"}
  ];

  var STAGE_CEILINGS = [
    {maxDay:7,  ceiling:"01:30"},
    {maxDay:14, ceiling:"01:00"},
    {maxDay:21, ceiling:"00:30"},
    {maxDay:75, ceiling:"00:00"}
  ];

  var ENDURANCE_KEYS = ["baseline","day25","day50","day75"];
  var ENDURANCE_LABELS = {baseline:"בסיס", day25:"יום 25", day50:"יום 50", day75:"יום 75"};

  var CHECK_META = {
    wake:     {points:10, label:"קימה"},
    lemon:    {points:5,  label:"מים עם לימון בבוקר"},
    water:    {points:10, label:"3 ליטר מים"},
    food:     {points:15, label:"יום אכילה מאוזן"},
    reading:  {points:10, label:"קריאה - 3 עמודים ומעלה"},
    learning: {points:15, label:"למידה - 30 דקות ומעלה"},
    quiet:    {points:10, label:"10 דקות ללא מסכים"},
    sleep:    {points:15, label:"נרדמתי בזמן אמש"},
    training: {points:5,  label:"אימון"},
    cardio:   {points:5,  label:"אירובי 15-20 דקות"}
  };

  /* ===================== פונקציות תאריך טהורות ===================== */
  function parseISO(dateISO){
    var parts = dateISO.split("-").map(Number);
    return Date.UTC(parts[0], parts[1]-1, parts[2]);
  }
  function isoFromUTCms(ms){
    var d = new Date(ms);
    var y = d.getUTCFullYear();
    var m = String(d.getUTCMonth()+1).padStart(2,"0");
    var day = String(d.getUTCDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function dayNumber(dateISO){
    var start = parseISO(CHALLENGE_START);
    var cur = parseISO(dateISO);
    return Math.floor((cur-start)/86400000)+1;
  }
  function dateFromDayNumber(n){
    var start = parseISO(CHALLENGE_START);
    return isoFromUTCms(start + (n-1)*86400000);
  }
  function weekdayOf(dateISO){
    return new Date(parseISO(dateISO)).getUTCDay(); // 0=ראשון ... 6=שבת
  }
  function isWeekend(dateISO){
    var wd = weekdayOf(dateISO);
    return wd===5 || wd===6;
  }
  function weekNumberForDay(dayNum){
    return Math.ceil(dayNum/7);
  }
  function weekDatesForWeekNumber(weekNum){
    var startDay = (weekNum-1)*7 + 1;
    var endDay = Math.min(weekNum*7, TOTAL_DAYS);
    var dates = [];
    for(var d=startDay; d<=endDay; d++) dates.push(dateFromDayNumber(d));
    return dates;
  }
  function stageNameForDay(dayNum){
    for(var i=0;i<STAGES.length;i++){
      if(dayNum>=STAGES[i].from && dayNum<=STAGES[i].to) return STAGES[i].name;
    }
    return "";
  }

  /* ===================== תקרת שינה (פונקציה טהורה) ===================== */
  function timeToMinutes(t){
    var parts = t.split(":").map(Number);
    return parts[0]*60+parts[1];
  }
  function laterTime(a,b){
    return timeToMinutes(a) >= timeToMinutes(b) ? a : b;
  }
  function stageCeilingForDay(dayNum){
    for(var i=0;i<STAGE_CEILINGS.length;i++){
      if(dayNum<=STAGE_CEILINGS[i].maxDay) return STAGE_CEILINGS[i].ceiling;
    }
    return "00:00";
  }
  function sleepCeiling(dateISO){
    var dayNum = dayNumber(dateISO);
    var stageCeil = stageCeilingForDay(dayNum);
    if(!isWeekend(dateISO)) return stageCeil;
    return laterTime(stageCeil, WEEKEND_SLEEP_CEILING);
  }

  /* ===================== ניקוד (פונקציה טהורה) ===================== */
  function calcScore(dayRecord, weekRecord, dateISO){
    var d = dayRecord || {};
    var w = weekRecord || {trainingDays:[]};
    var score = 0;
    if(d.wake) score += 10;
    if(d.lemon) score += 5;
    if(d.water) score += 10;
    if(d.food) score += 15;
    if(d.reading) score += 10;
    if(d.learning) score += 15;
    if(d.quiet) score += 10;
    if(d.sleep) score += 15;

    var trainingDays = w.trainingDays || [];
    var isPlannedTrainingDay = trainingDays.indexOf(dateISO) !== -1;

    if(trainingDays.length === 0 || !isPlannedTrainingDay){
      score += 10;
    } else {
      if(d.training) score += 5;
      if(d.cardio) score += 5;
    }
    return score;
  }
  function scoreLabel(score){
    if(score>=90) return {text:"יום מצוין", color:"var(--green)"};
    if(score>=80) return {text:"עמדת באתגר", color:"var(--blue)"};
    if(score>=70) return {text:"יום חלקי", color:"var(--orange)"};
    return {text:"יום שלא עמד בסטנדרט", color:"var(--red)"};
  }

  /* ===================== נתונים / localStorage ===================== */
  function defaultDayRecord(){
    return {wake:false,lemon:false,water:false,food:false,reading:false,
      learning:false,quiet:false,sleep:false,training:false,cardio:false,
      weekendWakeTime:null,note:""};
  }
  function defaultWeekRecord(){
    return {trainingDays:[],tefillinDay:null,tefillinDone:false,weight:null,note:""};
  }
  function defaultData(){
    return {
      version:1,
      days:{},
      weeks:{},
      endurance:{
        baseline:{date:null,distance:null,hr:null,feeling:null},
        day25:{date:null,distance:null,hr:null,feeling:null},
        day50:{date:null,distance:null,hr:null,feeling:null},
        day75:{date:null,distance:null,hr:null,feeling:null}
      },
      lastBackup:null
    };
  }
  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultData();
      var parsed = JSON.parse(raw);
      if(!parsed || typeof parsed !== "object") return defaultData();
      return parsed;
    }catch(e){
      return defaultData();
    }
  }
  function saveData(data){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
  function getDay(data, dateISO){
    return data.days[dateISO] ? Object.assign(defaultDayRecord(), data.days[dateISO]) : defaultDayRecord();
  }
  function getWeek(data, weekNum){
    var key = String(weekNum);
    return data.weeks[key] ? Object.assign(defaultWeekRecord(), data.weeks[key]) : defaultWeekRecord();
  }
  function updateDay(dateISO, patch){
    var data = loadData();
    var day = getDay(data, dateISO);
    Object.assign(day, patch);
    data.days[dateISO] = day;
    saveData(data);
  }
  function updateWeek(weekNum, patch){
    var data = loadData();
    var key = String(weekNum);
    var week = getWeek(data, weekNum);
    Object.assign(week, patch);
    data.weeks[key] = week;
    saveData(data);
  }

  /* ===================== עזרי תאריך מקומי (שעון המכשיר) ===================== */
  function todayISOLocal(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function yesterdayOf(dateISO){
    return isoFromUTCms(parseISO(dateISO) - 86400000);
  }
  function formatHebrewDate(dateISO){
    var parts = dateISO.split("-");
    return parts[2]+"."+parts[1]+"."+parts[0];
  }

  /* ===================== מצב אפליקציה ===================== */
  var realToday = todayISOLocal();
  var realDayNum = dayNumber(realToday);
  var appOutOfRange = (realDayNum < 1) || (realDayNum > TOTAL_DAYS);

  var state = {
    tab: "today",
    viewedDate: realToday
  };

  if(!appOutOfRange){
    var curWeekNum = weekNumberForDay(realDayNum);
    var curWeekRec = getWeek(loadData(), curWeekNum);
    if(weekdayOf(realToday) === 0 && curWeekRec.trainingDays.length === 0){
      state.tab = "week";
    }
  }

  /* ===================== Toast ===================== */
  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }

  /* ===================== רינדור: מסך היום ===================== */
  var MIN_MODE_KEYS = ["reading","learning","quiet","water","sleep"];

  function renderToday(){
    var root = document.getElementById("screen-today");

    if(appOutOfRange){
      var msg = realDayNum < 1
        ? "האתגר טרם התחיל. יום 1 יתחיל ב-" + formatHebrewDate(CHALLENGE_START)
        : "האתגר הסתיים ביום 75 (" + formatHebrewDate(dateFromDayNumber(TOTAL_DAYS)) + "). כל הכבוד על ההשלמה.";
      root.innerHTML =
        '<div class="summary-screen"><div class="big">KOBI 75</div><div>'+msg+'</div></div>';
      return;
    }

    var dateISO = state.viewedDate;
    var dayNum = dayNumber(dateISO);
    var weekNum = weekNumberForDay(dayNum);
    var data = loadData();
    var day = getDay(data, dateISO);
    var week = getWeek(data, weekNum);
    var score = calcScore(day, week, dateISO);
    var label = scoreLabel(score);
    var weekend = isWeekend(dateISO);
    var trainingDays = week.trainingDays || [];
    var isPlannedTrainingDay = trainingDays.indexOf(dateISO) !== -1;
    var noPlannedTrainingAtAll = trainingDays.length === 0;

    var minDay = 1;
    var maxDay = Math.min(TOTAL_DAYS, realDayNum);
    var prevDisabled = dayNum <= minDay;
    var nextDisabled = dayNum >= maxDay;

    var html = "";

    // באנר: תזכורת גיבוי אם עברו 7 ימים או יותר מהגיבוי האחרון (או שלא בוצע כלל)
    if(dateISO === realToday){
      var daysSinceBackup = data.lastBackup
        ? Math.floor((Date.now() - new Date(data.lastBackup).getTime()) / 86400000)
        : Infinity;
      if(daysSinceBackup >= 7){
        html += '<div class="banner warn" id="backup-banner-link">לא בוצע גיבוי מעל 7 ימים — חשוב לייצא נתונים בהגדרות</div>';
      }
    }

    // באנר: לא נבחרו ימי אימון
    if(noPlannedTrainingAtAll){
      html += '<div class="banner danger">לא נבחרו ימי אימון לשבוע הזה</div>';
    }

    // באנר: אתמול לא הושלם (רק כשצופים בהיום האמיתי)
    if(dateISO === realToday){
      var yISO = yesterdayOf(dateISO);
      var yDayNum = dayNumber(yISO);
      if(yDayNum >= 1){
        var yWeekNum = weekNumberForDay(yDayNum);
        var yDay = getDay(data, yISO);
        var yWeek = getWeek(data, yWeekNum);
        var yScore = calcScore(yDay, yWeek, yISO);
        if(yScore < 100){
          html += '<div class="banner info" id="yesterday-link" style="cursor:pointer;">אתמול לא הושלם — לחצו לעריכה</div>';
        }
      }
    }

    // Never miss twice - אם אתמול הציון היה מתחת ל-70
    if(dateISO === realToday){
      var yISO2 = yesterdayOf(dateISO);
      if(dayNumber(yISO2) >= 1){
        var yWeekNum2 = weekNumberForDay(dayNumber(yISO2));
        var yScore2 = calcScore(getDay(data, yISO2), getWeek(data, yWeekNum2), yISO2);
        if(yScore2 < 70){

  }

      html += '<div class="info">יום '+wd+' · '+formatHebrewDate(dISO)+(locked?' 🔒':'')+'</div>';

    html += '</div></div>';

    html += '<div class="field-block"><div class="field-label">יום תפילין</div>';

    html += '<div class="field-block"><div class="field-label">משקל שבועי (ק"ג)</div>';
    html += '<input type="number" step="0.1" id="week-weight" value="'+(week.weight!=null?week.weight:"")+'" placeholder="לדוגמה 78.5">';
    html += '</div>';

    html += '<table class="week-table"><thead><tr><th>יום</th><th>תאריך</th><th>ציון</th></tr></thead><tbody>';
    var sum = 0, count = 0;
    dates.forEach(function(dISO){
      var dN = dayNumber(dISO);
      var dayData = getDay(data, dISO);
      var wk = getWeek(data, weekNumberForDay(dN));
      var sc = calcScore(dayData, wk, dISO);
      var wd = ["א'","ב'","ג'","ד'","ה'","ו'","ש'"][weekdayOf(dISO)];
      sum += sc; count++;
      html += '<tr><td>'+wd+'</td><td>'+formatHebrewDate(dISO)+'</td><td>'+sc+'</td></tr>';
    });
    html += '</tbody></table>';
    html += '<p class="field-label">ממוצע שבועי: '+(count?Math.round(sum/count):0)+'</p>';

    html += '<div class="field-block"><div class="field-label">הערה שבועית</div>';

    root.innerHTML = html;

    root.querySelectorAll(".week-day-row").forEach(function(rowEl){
      rowEl.addEventListener("click", function(){
        var dISO = rowEl.getAttribute("data-date");
        var locked = rowEl.getAttribute("data-locked") === "1";
        var chosenNow = trainingDays.indexOf(dISO) !== -1;

        if(locked && !chosenNow){
          showToast("היום הזה כבר הסתיים, לא ניתן להזיז אליו אימון רטרואקטיבית");

        if(locked && chosenNow){

        if(chosenNow){

        } else {

        if(state.tab==="today") renderToday();

      updateWeek(weekNum, {note: noteEl.value});
    });
  }

  /* ===================== רינדור: מסך מגמה ===================== */
  function buildLineChartSVG(points, opts){
    var width = opts.width || 320, height = opts.height || 160, pad = opts.padding || 26;
    var xMin = opts.xMin, xMax = opts.xMax, yMin = opts.yMin, yMax = opts.yMax;
    var color = opts.color || "#2dd4a7";
    function xPix(x){ return pad + (width-2*pad) * ((x-xMin)/((xMax-xMin)||1)); }
    function yPix(y){ return height-pad - (height-2*pad) * ((y-yMin)/((yMax-yMin)||1)); }

    var svg = '<svg viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="xMidYMid meet">';
    [yMin, (yMin+yMax)/2, yMax].forEach(function(gv){
      var gy = yPix(gv);
      svg += '<line x1="'+pad+'" y1="'+gy.toFixed(1)+'" x2="'+(width-pad)+'" y2="'+gy.toFixed(1)+'" stroke="#26313d" stroke-width="1"/>';
      svg += '<text x="'+(pad-4)+'" y="'+(gy+3).toFixed(1)+'" font-size="9" fill="#8a97a5" text-anchor="end">'+Math.round(gv)+'</text>';
    });
    (opts.checkpoints||[]).forEach(function(cp){
      var cx = xPix(cp.x);
      svg += '<line x1="'+cx.toFixed(1)+'" y1="'+pad+'" x2="'+cx.toFixed(1)+'" y2="'+(height-pad)+'" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3"/>';
      svg += '<text x="'+cx.toFixed(1)+'" y="'+(pad-8)+'" font-size="9" fill="#f59e0b" text-anchor="middle">'+cp.label+'</text>';
    });
    if(points.length){
      var d = points.map(function(p,i){ return (i===0?'M':'L')+xPix(p.x).toFixed(1)+','+yPix(p.y).toFixed(1); }).join(' ');
      svg += '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
      points.forEach(function(p){
        svg += '<circle cx="'+xPix(p.x).toFixed(1)+'" cy="'+yPix(p.y).toFixed(1)+'" r="2.5" fill="'+color+'"/>';
      });
    } else {
      svg += '<text x="'+(width/2)+'" y="'+(height/2)+'" font-size="11" fill="#8a97a5" text-anchor="middle">אין עדיין נתונים</text>';
    }
    svg += '</svg>';
    return svg;
  }

  function renderTrend(){
    var root = document.getElementById("screen-trend");
    var data = loadData();

    var scorePoints = [];
    for(var d=1; d<=TOTAL_DAYS; d++){
      var dISO2 = dateFromDayNumber(d);
      if(data.days[dISO2]){
        var wk2 = getWeek(data, weekNumberForDay(d));
        var dy2 = getDay(data, dISO2);
        scorePoints.push({x:d, y:calcScore(dy2, wk2, dISO2)});
      }
    }
    var checkpoints = [
      {x:25, label:"יום 25"},
      {x:50, label:"יום 50"},
      {x:75, label:"יום 75"}
    ];
    var scoreSvg = buildLineChartSVG(scorePoints, {width:320,height:160,padding:26,xMin:1,xMax:TOTAL_DAYS,yMin:0,yMax:100,color:"#2dd4a7",checkpoints:checkpoints});

    var weeklyAvgHtml = '<div class="weekly-avg-list">';
    var weightPoints = [];
    for(var w=1; w<=11; w++){
      var dates = weekDatesForWeekNumber(w);
      var sum = 0, count = 0;
      dates.forEach(function(dISO){
        if(data.days[dISO]){
          var wk = getWeek(data, w);
          var dy = getDay(data, dISO);
          sum += calcScore(dy, wk, dISO);
          count++;
        }
      });
      var avg = count ? Math.round(sum/count) : null;
      weeklyAvgHtml += '<div class="weekly-avg-row"><span>שבוע '+w+'</span><span>'+(avg!=null?avg:'—')+'</span></div>';
      var weekRec = getWeek(data, w);
      if(weekRec.weight != null && weekRec.weight !== "") weightPoints.push({x:w, y:parseFloat(weekRec.weight)});
    }
    weeklyAvgHtml += '</div>';

    var weightSvg;
    if(weightPoints.length){
      var weights = weightPoints.map(function(p){return p.y;});
      var wMin = Math.min.apply(null, weights) - 1;
      var wMax = Math.max.apply(null, weights) + 1;
      if(wMin === wMax){ wMin -= 1; wMax += 1; }
      weightSvg = buildLineChartSVG(weightPoints, {width:320,height:140,padding:26,xMin:1,xMax:11,yMin:wMin,yMax:wMax,color:"#38bdf8",checkpoints:[]});
    } else {
      weightSvg = buildLineChartSVG([], {width:320,height:140,padding:26,xMin:1,xMax:11,yMin:0,yMax:1,color:"#38bdf8",checkpoints:[]});
    }

    var endurance = data.endurance || defaultData().endurance;
    var enduranceHtml = '<table class="endurance-table"><thead><tr><th>מבחן</th><th>תאריך</th><th>מרחק</th><th>דופק</th><th>הרגשה 1-10</th></tr></thead><tbody>';

      enduranceHtml += '<td><input type="text" data-ekey="'+key+'" data-field="distance" value="'+(rec.distance!=null?rec.distance:"")+'" placeholder="ק&quot;מ"></td>';
      enduranceHtml += '<td><input type="text" data-ekey="'+key+'" data-field="hr" value="'+(rec.hr!=null?rec.hr:"")+'" placeholder="דופק"></td>';
      enduranceHtml += '<td><input type="text" data-ekey="'+key+'" data-field="feeling" value="'+(rec.feeling!=null?rec.feeling:"")+'" placeholder="1-10"></td>';
      enduranceHtml += '</tr>';
    });
    enduranceHtml += '</tbody></table>';

    var html = '<h2 class="screen-title">מגמה</h2>';
    html += '<div class="chart-card"><div class="field-label">ציון יומי לאורך האתגר</div>'+scoreSvg+'</div>';
    html += '<div class="field-block"><div class="field-label">ממוצע ציון שבועי</div>'+weeklyAvgHtml+'</div>';
    html += '<div class="chart-card"><div class="field-label">משקל שבועי</div>'+weightSvg+'</div>';
    html += '<div class="field-block"><div class="field-label">מבחן הסיבולת</div>'+enduranceHtml+'</div>';

    root.innerHTML = html;

        }
        var d2 = loadData();
        if(!d2.endurance) d2.endurance = defaultData().endurance;
        if(!d2.endurance[key]) d2.endurance[key] = {date:null,distance:null,hr:null,feeling:null};
        d2.endurance[key][field] = val;
        saveData(d2);

  function renderSettings(){
    var root = document.getElementById("screen-settings");

    var html = '<h2 class="screen-title">הגדרות</h2>';
    html += '<button class="export-btn" id="export-btn">ייצוא JSON (העתקה + הורדה)</button>';

    var backupText = data.lastBackup
      ? ("גיבוי אחרון: " + formatHebrewDate(data.lastBackup.slice(0,10)))
      : "עדיין לא בוצע גיבוי";
    html += '<div class="placeholder-card">'+backupText+'</div>';

    html += '<div class="field-block" style="margin-top:16px;"><div class="field-label">ייבוא JSON</div>';
    html += '<textarea id="import-text" placeholder="הדביקו כאן JSON שיוצא בעבר..."></textarea>';
    html += '<div class="import-row"><button id="import-btn">ייבוא</button></div>';
    html += '</div>';

    html += '<button class="danger-btn" id="reset-btn">איפוס מלא</button>';

    root.innerHTML = html;

    document.getElementById("export-btn").onclick = function(){
      var d = loadData();
      d.lastBackup = new Date().toISOString();
      saveData(d);
      var json = JSON.stringify(d, null, 2);
      try{ navigator.clipboard && navigator.clipboard.writeText(json); }catch(e){}
      try{
        var blob = new Blob([json], {type:"application/json"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "kobi75-backup-" + todayISOLocal() + ".json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }catch(e){}
      showToast("הנתונים יוצאו והועתקו ללוח");
      renderAll();
    };

    document.getElementById("import-btn").onclick = function(){
      var text = document.getElementById("import-text").value.trim();
      if(!text){ showToast("אין מה לייבא"); return; }
      var parsed;
      try{
        parsed = JSON.parse(text);
      }catch(e){
        showToast("שגיאה בפענוח ה-JSON");
        return;
      }
      if(!parsed || typeof parsed !== "object" || typeof parsed.days !== "object" || typeof parsed.weeks !== "object"){
        showToast("קובץ לא תקין - חסרים שדות days/weeks");
        return;
      }
      saveData(parsed);
      showToast("הנתונים יובאו בהצלחה");
      renderAll();
    };

    document.getElementById("reset-btn").onclick = function(){
      if(confirm("פעולה זו תמחק את כל הנתונים לצמיתות ולא ניתן לשחזר אותה. להמשיך?")){
        if(confirm("אישור סופי: למחוק את כל הנתונים כעת?")){
          localStorage.removeItem(STORAGE_KEY);
          location.reload();
        }
      }
    };
  }

  /* ===================== ניווט טאבים ===================== */
  function renderAll(){
    document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
    document.getElementById("screen-"+state.tab).classList.add("active");
    document.querySelectorAll("#bottom-nav button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===state.tab);
    });
    renderToday();
    renderWeek();
    renderTrend();
    renderSettings();
  }

  document.querySelectorAll("#bottom-nav button").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.tab = btn.getAttribute("data-tab");
      renderAll();
    });
  });

  renderAll();

  /* ===================== בדיקות קבלה (מצב פיתוח בלבד) ===================== */
  var DEV_MODE = (location.protocol === "file:") ||
                 (location.hostname === "localhost") ||
                 (location.hostname === "127.0.0.1") ||
                 (location.search.indexOf("dev=1") !== -1);

  function assertEqual(actual, expected, label){
    var pass = JSON.stringify(actual) === JSON.stringify(expected);
    console.log((pass?"✅ ":"❌ ") + label + " | expected=" + JSON.stringify(expected) + " actual=" + JSON.stringify(actual));
    return pass;
  }

  function runAcceptanceTests(){
    console.group("KOBI75 - בדיקות קבלה");
    var allPass = true;

    function full(over){
      return Object.assign({wake:true,lemon:true,water:true,food:true,reading:true,
        learning:true,quiet:true,sleep:true,training:false,cardio:false}, over||{});
    }

    // --- ניקוד ---
    allPass &= assertEqual(
      calcScore(full({training:true,cardio:true}), {trainingDays:["2026-08-30","2026-09-01"]}, "2026-08-30"),
      100, "ניקוד #1 - הכל מסומן, יום אימון מתוכנן ובוצע");

    allPass &= assertEqual(
      calcScore(full({training:false,cardio:false}), {trainingDays:["2026-08-30","2026-09-01"]}, "2026-08-30"),
      90, "ניקוד #2 - יום אימון מתוכנן אך לא בוצע");

    allPass &= assertEqual(
      calcScore(full({training:false,cardio:false}), {trainingDays:["2026-09-01","2026-09-02"]}, "2026-08-31"),
      100, "ניקוד #3 - יום ללא אימון מתוכנן, כל 8 היומיים מסומנים");

    allPass &= assertEqual(
      calcScore(full({reading:false,quiet:false}), {trainingDays:["2026-09-01","2026-09-02"]}, "2026-08-31"),
      80, "ניקוד #4 - יום ללא אימון מתוכנן, חסרים קריאה ושקט");

    allPass &= assertEqual(
      calcScore(full({sleep:false}), {trainingDays:["2026-09-01","2026-09-02"]}, "2026-08-31"),
      85, "ניקוד #5 - יום ללא אימון מתוכנן, חסרה שינה בלבד");

    allPass &= assertEqual(
      calcScore(full(), {trainingDays:[]}, "2026-08-30"),
      100, "ניקוד #6 - שבוע ללא trainingDays, כל 8 היומיים מסומנים");

    // --- תקרת שינה ---
    allPass &= assertEqual(sleepCeiling("2026-09-04"), "01:30", "תקרת שינה #7 - יום 6, שישי");
    allPass &= assertEqual(sleepCeiling("2026-09-10"), "01:00", "תקרת שינה #8 - יום 12, חמישי");
    allPass &= assertEqual(sleepCeiling("2026-09-16"), "00:30", "תקרת שינה #9 - יום 18, רביעי");
    allPass &= assertEqual(sleepCeiling("2026-09-19"), "01:00", "תקרת שינה #10 - יום 21, שבת");
    allPass &= assertEqual(sleepCeiling("2026-10-01"), "00:00", "תקרת שינה #11 - יום 33, חמישי");
    allPass &= assertEqual(sleepCeiling("2026-10-03"), "01:00", "תקרת שינה #12 - יום 35, שבת");

    // --- מספור ימים ---
    allPass &= assertEqual(dayNumber("2026-08-30"), 1, "מספור ימים #13");
    allPass &= assertEqual(dayNumber("2026-09-23"), 25, "מספור ימים #14");
    allPass &= assertEqual(dayNumber("2026-10-18"), 50, "מספור ימים #15");
    allPass &= assertEqual(dayNumber("2026-11-12"), 75, "מספור ימים #16");

    // --- שמירה (מפתח בדיקה נפרד, לא נוגע בנתונים האמיתיים) ---
    (function(){
      var TEST_KEY = "__kobi75_test__";
      var sample = {version:1, days:{"2026-08-30":{wake:true}}, weeks:{}, endurance:{}, lastBackup:null};
      localStorage.setItem(TEST_KEY, JSON.stringify(sample));
      var reloaded = JSON.parse(localStorage.getItem(TEST_KEY));
      allPass &= assertEqual(reloaded.days["2026-08-30"].wake, true, "שמירה #17 - localStorage שומר ונטען בחזרה");
      localStorage.removeItem(TEST_KEY);
    })();

    // --- ייצוא/ייבוא: בדיקת round-trip של סריאליזציה (הבסיס שעליו נבנה ייבוא ב-שלב 2) ---
    (function(){
      var sample = defaultData();
      sample.days["2026-08-30"] = full({training:true,cardio:true});
      sample.weeks["1"] = {trainingDays:["2026-08-30"], tefillinDay:null, tefillinDone:false, weight:78.5, note:"טוב"};
      var json = JSON.stringify(sample);
      var restored = JSON.parse(json);
      allPass &= assertEqual(restored, sample, "ייצוא/ייבוא #18 - round-trip של JSON זהה למקור");
    })();

    console.log(allPass ? "✅ כל הבדיקות עברו" : "❌ יש בדיקות שנכשלו, ראה למעלה");
    console.groupEnd();
  }

  if(DEV_MODE){
    runAcceptanceTests();
  }

})();
</script>
</body>
</html>
